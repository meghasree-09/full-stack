<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
</head>
<body>
    <h1>Student Regitration</h1>
    <form>
        <fieldset>
            <legend>Basic Information</legend>
        <label for="Name">Name</label>
        <input type="text"
        id="name"requrired/><br><br>
        <label for="email">Email</label>
        <input type="email"
        id="email" required/><br><br>
        <label>DOB</label>
        <input type="date"
        id="date" reqired/><br><br>
        <label for="gender">Gender:</label>
        <input name="Gender" type="radio" id="gender"/>Male
        <input name="Gender" type="radio" id="gender"/>Female
        <input name="Gender" type="radio" id="gender"/>Others<br><br>
        <label for="age">Age</label>
        <input type="number"
        id="age"
        min="18"
        max="60" required>
        </fieldset>
        <fieldset>
            <legend>Acadamic Details</legend><br>
        <label>Courses available</label>
        <select>
            <option>Pyhon</option>
            <option>Java</option>
            <option>SAP</option>
            <option>AWS</option>
            <option>Service Now</option>
            <option>Sales Force</option>
            <option>Full stack</option>
            <option>MERN stack</option>
            <option>Ethical Hacking</option>
        </select><br><br>
        <label for="bio">Bio</label>
        <textarea
         id="bio"
        placeholder="Enter something interesting..."
         />
        </textarea><br><br>
        <label>Resume:</label>
        <input type="file" required/><br><br>
 
        </fieldset>
        <legend>Additional information</legend>
        <fieldset>
        <label>Progress on Tech</label>
        <input type="range"
        id="Progress"
        min="0"
        max="10">
        </fieldset>
        <input type="checkbox" required/>
        <label>I accept this info is correct as my knowledge</label>
        <button type="submit">Submit</button>
        
    </form>
</body>
</html>
